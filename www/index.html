<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fff8f0">
<title>训练记录</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="title">训练记录</div>
    <button class="chip" id="btn-settings" aria-label="设置">
      <!-- 三根带滑块的横杆（调节/设置）；齿轮画不好就会像太阳，干脆用滑块 -->
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16"/>
        <circle cx="9" cy="7" r="2.6" fill="#fff"/>
        <circle cx="15" cy="12" r="2.6" fill="#fff"/>
        <circle cx="8" cy="17" r="2.6" fill="#fff"/>
      </svg>
    </button>
  </div>

  <div class="screen" id="screen"></div>

  <div class="tabbar" id="tabbar">
    <button data-tab="plans">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      计划
    </button>
    <button data-tab="train">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      训练
    </button>
    <button data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
      日程
    </button>
    <button data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
      统计
    </button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
