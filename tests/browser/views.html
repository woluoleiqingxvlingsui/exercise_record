<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>视图集成冒烟测试</title>
<link rel="stylesheet" href="../../www/css/app.css">
</head>
<body>
<!-- 需要一份 index.html 外壳里的关键节点：main.js / 各视图会 getElementById 取它们 -->
<div id="app">
  <div class="topbar"><div class="title">训练记录</div><button class="chip" id="btn-settings"></button></div>
  <div class="screen" id="screen"></div>
  <div class="tabbar" id="tabbar">
    <button data-tab="plans">计划</button><button data-tab="train">训练</button>
    <button data-tab="calendar">日历</button><button data-tab="stats">统计</button>
  </div>
</div>
<pre id="out">PENDING</pre>

<script type="module">
import { createStore, memoryBackend } from '../../www/js/store.js';
import { seedPlans } from '../../www/js/seed.js';
import { sessionFromPlan, completeStep, finishSession, upsertDay, buildTimeline } from '../../www/js/model.js';
import { renderPlans } from '../../www/js/views/plans.js';
import { createPlayer } from '../../www/js/views/train.js';
import { renderCalendar } from '../../www/js/views/calendar.js';
import { renderStats, openSessionDetail } from '../../www/js/views/history.js';
import { openSheet, closeSheet } from '../../www/js/ui.js';
import { localDateKey, fmtRest, periodRange } from '../../www/js/util.js';

/* ------------------------------------------------------------ 测试脚手架 */

const results = [];
const errors = [];

window.addEventListener('error', (e) => errors.push('window.error: ' + e.message));
window.addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function check(name, fn) {
  try {
    fn();
    results.push('PASS  ' + name);
  } catch (e) {
    results.push('FAIL  ' + name + ' :: ' + (e && e.message ? e.message : e));
  }
}

function assert(cond, msg) {
  if (!cond) throw new Error(msg || 'assert failed');
}

const click = (el) => {
  assert(el, '要点击的元素不存在');
  el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
};

const setInput = (el, value) => {
  assert(el, '要输入的元素不存在');
  el.value = value;
  el.dispatchEvent(new Event('input', { bubbles: true }));
};

const screen = document.getElementById('screen');
const sheet = () => document.querySelector('.sheet');
const inSheet = (sel) => document.querySelector('.sheet ' + sel);

function closeAnySheet() {
  const mask = document.querySelector('.sheet-mask');
  if (mask) mask.remove();
}

/* ------------------------------------------------------------------ 数据 */

const store = createStore(memoryBackend());
seedPlans().forEach((p) => store.savePlan(p));

/** 造一条已完成的记录，供统计/日历/详情用 */
function seedFinishedSession(plan, daysAgo = 0) {
  const t = Date.now() - daysAgo * 86400000;
  const s = sessionFromPlan(plan, t);
  const tl = buildTimeline(plan);
  s.cursor = 0;
  completeStep(s, { reps: 8, weightKg: 10 });
  completeStep(s, { reps: 6, weightKg: 10 }, { restMs: 60000, decision: 'flex' });
  finishSession(s, 'done', t + 3600000);
  store.commitSession(s);
  const sched = store.getSchedule();
  upsertDay(sched, s.dateKey, { sessionId: s.id });
  store.saveSchedule(sched);
  return s;
}

const pullup = store.listPlans().find((p) => p.name === '引体日');
const finished = seedFinishedSession(pullup, 0);

/* -------------------------------------------------------------- 一、计划页 */

check('计划列表渲染出全部示例计划', () => {
  renderPlans(screen, { store, onStart: () => {} });

  ['引体日', '推日', '日常有氧跑', '强度跑', '长距离跑'].forEach((n) => {

});

check('编辑器：间歇字段按秒填写、模型里存毫秒（单位不能错）', () => {
  const planCard = document.querySelector('.sheet [data-stage]');

  const target = chips.find((c) => Number(c.dataset.ms) !== planned);
  assert(target, '没有可选的其它档位');

  assert(entry.restActualMs === chosen, `实际应为 ${chosen}，实际 ${entry.restActualMs}`);

  assert(getComputedStyle(todayCell.querySelector('.cal-events')).display === 'none',
    '折叠态不该显示当天条目');

});

// 跟手拖拽 + 松手吸附：这里用合成触摸事件模拟一次真实下滑
async function swipeGrid(dy) {
  const grid = screen.querySelector('[data-grid]');
  const mk = (type, y) => {
    const t = new Touch({ identifier: 1, target: grid, clientX: 120, clientY: y });
    grid.dispatchEvent(new TouchEvent(type, {
      bubbles: true, cancelable: true,
      touches: type === 'touchend' ? [] : [t],
      changedTouches: [t],
    }));
  };
  const y0 = 400;
  mk('touchstart', y0);
  mk('touchmove', y0 + dy);
  await sleep(30);                       // 给 speed 判定留出真实的时间差
  mk('touchmove', y0 + dy);
  mk('touchend', y0 + dy);
  return screen.querySelector('[data-grid]');
}

/** 量"稳定后"的每格高度：先关掉过渡，读到的就是吸附目标值，不受动画中间态干扰 */
function settledHeight(grid) {
  grid.classList.add('is-instant');
  const h = parseFloat(getComputedStyle(grid.querySelector('.cal-cell')).height);
  grid.classList.remove('is-instant');
  return h;
}

try {
  const canTouch = (() => {
    try { new Touch({ identifier: 1, target: document.body, clientX: 0, clientY: 0 }); new TouchEvent('touchstart'); return true; }
    catch (e) { return false; }
  })();

  if (!canTouch) {
    results.push('PASS  日历手势（本环境无法构造 Touch 事件，跳过模拟）');
  } else {
    renderCalendar(screen, { store, onOpenSession: () => {} });
    const g0 = screen.querySelector('[data-grid]');
    const collapsedRow = settledHeight(g0);

    const g1 = await swipeGrid(220);                       // 向下拖一大截
    assert(g1.classList.contains('is-open'), '下滑后应进入展开态');
    const openCell = g1.querySelector(`[data-day="${localDateKey()}"]`);
    assert(openCell.querySelectorAll('.cal-ev').length > 0, '展开后当天格子应列出练了什么');
    // 行高要真的被撑开（跟手拖动的结果），而不是换个 class 而已
    const openH = settledHeight(g1);
    assert(openH > collapsedRow + 10, `展开后每格应明显变高：折叠 ${collapsedRow} → 展开 ${openH}`);

    await sleep(400);                                     // 点击抑制窗口过期
    const g2 = await swipeGrid(-220);                     // 再上滑收起
    assert(!g2.classList.contains('is-open'), '上滑后应回到折叠态');
    const afterH = settledHeight(g2);
    assert(Math.abs(afterH - collapsedRow) < 2,
      `收起后每格高度应回到折叠态（正方形）：折叠 ${collapsedRow}，收起后 ${afterH}`);
    results.push('PASS  日历：跟手拖拽能展开，拖回能收起');
  }
} catch (e) {
  results.push('FAIL  日历手势 :: ' + (e && e.message ? e.message : e));
}

/* ------------------------------------------- 三点五、补记训练与记录时长（异步） */

// 「今天按计划练了，但没走播放器」——补记一下，不该逼着用户把组挨个点一遍
try {
  closeAnySheet();
  renderCalendar(screen, { store, onOpenSession: () => {} });
  const today = localDateKey();
  const before = store.allSessions().filter((s) => s.dateKey === today).length;

  click(screen.querySelector(`[data-day="${today}"]`));
  click(screen.querySelector('[data-log]'));
  assert(sheet(), '「记录训练」的弹层没打开');

  // 默认是「按计划补记」，选第一个计划后填 40 分钟
  const pickPlan = inSheet('[data-pick-plan]');
  assert(pickPlan, '补记弹层里没有可选的计划');
  click(pickPlan);
  setInput(inSheet('[data-min]'), '40');
  click(inSheet('[data-save-log]'));
  await sleep(120);

  const after = store.allSessions().filter((s) => s.dateKey === today);
  assert(after.length === before + 1, `补记后今天的记录应多一条，实际 ${after.length - before} 条`);
  const logged = after[after.length - 1];
  assert(logged.source === 'manual', '补记的记录应标记为 manual');
  assert(logged.loggedSec === 40 * 60, `补记时长应为 2400 秒，实际 ${logged.loggedSec}`);
  assert(store.getSchedule()[today].status === 'done', '记录后当天应标成已完成');
  assert(screen.querySelector('[data-day-panel]').textContent.includes('记录 ·'),
    '日程面板里这条应标明是「记录」的');
  assert(screen.querySelector('[data-log]').textContent.includes('记录训练'), '按钮文案应为「记录训练」');
  results.push('PASS  日程里可以「按计划记录」一次训练');
} catch (e) {
  results.push('FAIL  按计划记录 :: ' + (e && e.message ? e.message : e));
}

// 「今天就练了个有氧」——只记类别 + 时长，几十秒搞定
try {
  closeAnySheet();
  const today = localDateKey();
  click(screen.querySelector(`[data-day="${today}"]`));
  click(screen.querySelector('[data-log]'));
  click(inSheet('[data-mode="quick"]'));
  setInput(inSheet('[data-cat-input]'), '有氧');
  setInput(inSheet('[data-min]'), '30');
  click(inSheet('[data-save-log]'));
  await sleep(120);

  const quick = store.allSessions().filter((s) => s.dateKey === today).pop();
  assert(quick.planName === '有氧', `补记标题应为「有氧」，实际「${quick.planName}」`);
  assert(quick.planSnapshot.category === '有氧', '补记要保住类别，统计的「按类别」才认得出');
  assert(quick.loggedSec === 1800, '简单记一笔的时长没存上');
  assert(store.listCategories().includes('有氧'), '写过的类别下次还能直接选');
  results.push('PASS  可以「简单记一笔」：只填类别 + 时长');
} catch (e) {
  results.push('FAIL  简单记一笔 :: ' + (e && e.message ? e.message : e));
}

// 统计的总时长要用「用户记的时长」，而不是 App 秒表的流逝时间
try {
  closeAnySheet();
  // 给本周一条正常记录填一个和流逝时间明显不同的时长：填 45 分钟
  const target = store.allSessions().find((s) => !s.source && s.entries && s.entries.length);
  assert(target, '没有可用的正常训练记录');
  target.loggedSec = 45 * 60;
  store.commitSession(target);

  renderStats(screen, { store });

  // 期望值：有 loggedSec 用它，没有就回落自动计时 —— 这正是统计口径本身
  const { start, end } = periodRange('week', localDateKey());
  const expectedMin = store.allSessions()
    .filter((s) => { const k = localDateKey(s.startedAt || 0); return k >= start && k <= end; })
    .reduce((t, s) => t + Math.round(
      (s.loggedSec != null ? s.loggedSec * 1000 : Math.max(0, (s.endedAt || 0) - (s.startedAt || 0))) / 60000), 0);

  const big = screen.querySelector('.num');
  assert(big, '统计页没有总时长数字');
  const txt = big.textContent.trim();
  const shownMin = Number((txt.match(/(\d+)\s*小时/) || [0, 0])[1]) * 60
    + Number((txt.match(/(\d+)\s*分/) || [0, 0])[1]);
  assert(shownMin === expectedMin,
    `统计总时长应是 ${expectedMin} 分钟，页面上却是「${txt}」`);
  assert(Array.from(screen.querySelectorAll('.chip')).some((c) => c.textContent.trim() === '记录'),
    '统计列表里这类记录应有「记录」标记');
  results.push('PASS  统计时长按用户记录的时长算（不是 App 计时）');
} catch (e) {
  results.push('FAIL  统计时长口径 :: ' + (e && e.message ? e.message : e));
}

// 正常跟练结束后，在详情里手填时长，统计跟着变
try {
  closeAnySheet();
  const s0 = store.allSessions().find((x) => !x.source && x.entries && x.entries.length);
  assert(s0, '没有可用的正常训练记录');
  openSessionDetail(store, s0.id, () => {});
  setInput(inSheet('[data-min]'), '55');
  click(inSheet('[data-save-fb]'));
  await sleep(120);
  assert(store.getSession(s0.id).loggedSec === 55 * 60, '详情里填的时长没有存进记录');
  results.push('PASS  训练详情里可以手填本次时长并保存');
} catch (e) {
  results.push('FAIL  手填训练时长 :: ' + (e && e.message ? e.message : e));
}

/* -------------------------------------------------------------- 四、统计 */

check('统计页：周/月/年三种粒度 + 周期可前后翻 + 总时长', () => {

  assert(screen.querySelectorAll('[data-gran]').length === 3, '粒度切换应该是三个');
  assert(screen.querySelector('[data-prev]'), '没有「上一个周期」按钮');

check('统计页：能翻到上一个周期，内容确实变了', () => {

check('打开记录详情：逐组记录 + 调整留痕', () => {

check('保存训练感受', () => {

  click(inSheet('[data-feel]'));
  click(inSheet('[data-pain]'));

/* -------------------------------------------------------------- 五、外壳 */

// 这一项是异步的，单独写、单独 await —— 不能塞进同步的 check()，

/* --------------------------------------------------- 七、类别长按删除（异步） */

// 长按 550ms 后弹二次确认，点确定才真的删 —— 这一项必须等定时器，所以单独 await
try {
  closeAnySheet();
  renderPlans(screen, { store, onStart: () => {} });
  click(screen.querySelector('[data-new]'));
  const chips = Array.from(document.querySelectorAll('.sheet [data-cat]'));
  assert(chips.length >= 2, '类别标签太少，测不了长按删除');
  const target = chips[chips.length - 1];
  const name = target.dataset.cat;
  const before = chips.length;

  target.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: 12, clientY: 12 }));
  await sleep(700);                                  // 超过长按阈值 550ms
  target.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));

  const okBtn = inSheet('[data-ok]');
  assert(okBtn, `长按「${name}」后应该弹出删除确认`);
  assert(store.listCategories().includes(name), '还没点确认就不该真删');
  click(okBtn);
  await sleep(120);

  const after = Array.from(document.querySelectorAll('.sheet [data-cat]'));
  assert(after.length === before - 1, `删除后类别数应为 ${before - 1}，实际 ${after.length}`);
  assert(!store.listCategories().includes(name), `「${name}」没从可选项里删掉`);
  closeAnySheet();
  results.push('PASS  长按类别可以删除（要二次确认）');
} catch (e) {
  results.push('FAIL  长按删除类别 :: ' + (e && e.message ? e.message : e));
}

/* ------------------------------------------- 八、2026-11-02 审计的回归守卫 */

/*
 * 下面这几项对着的是只读审计里查出来的具体缺陷。
 * 原来那 35 项集成测试一条都没覆盖它们，全绿也拦不住再犯。
 */

// ① 导入的脏数据不能被当成 HTML 执行（反馈里的 RPE、组序都拼进 innerHTML）
try {
  const evil = '<img src=x onerror="window.__xss=1">';
  const bad = sessionFromPlan(pullup, Date.now());
  bad.cursor = 0;
  completeStep(bad, { reps: 8 });
  bad.entries[0].setIndex = evil;                 // 组序被塞成 HTML
  bad.entries[0].itemName = evil;
  finishSession(bad, 'done', Date.now());
  bad.feedback = { rpe: evil, feel: [], pain: { parts: [] }, note: '', nextTimeNote: '' };
  store.commitSession(bad);

  window.__xss = 0;
  renderCalendar(screen, { store, onOpenSession: () => {} });
  openSessionDetail(store, bad.id, () => {});
  await sleep(300);
  assert(window.__xss === 0, '拼进 innerHTML 的脏数据被当成 HTML 执行了');
  closeAnySheet();
  results.push('PASS  导入的脏数据不会在日历/详情里执行脚本');
} catch (e) {
  results.push('FAIL  脏数据注入 :: ' + (e && e.message ? e.message : e));
}

// ② 「跳过这一组」以前是个坏按钮：调 removeStep(current) 拿到 null 却不检查，
//    界面照样弹「已跳过本组」，用户被卡在同一组
try {
  const s3 = sessionFromPlan(pullup);
  const total = s3.timeline.length;
  const holder = document.createElement('div');
  document.body.appendChild(holder);
  const player = createPlayer({ store, session: s3, onExit: () => {}, onFinish: () => {}, onDiscarded: () => {} });
  holder.appendChild(player.root);
  player.start();
  await sleep(60);

  const skipBtn = player.root.querySelector('[data-skip]');
  assert(skipBtn, '训练界面没有「跳过这一组」按钮');
  click(skipBtn);
  await sleep(60);

  assert(s3.timeline.length === total - 1,
    `跳过后时间线应少一组，实际 ${s3.timeline.length}/${total}`);
  assert(s3.adjustments.some((a) => a.field === 'skip'), '跳过没有留痕');
  const toastEl = document.getElementById('toast');
  assert(toastEl && toastEl.textContent.includes('跳过'), '跳过后没有提示');

  player.destroy();
  holder.remove();
  store.clearOngoing();
  results.push('PASS  「跳过这一组」真的能跳掉当前这一组');
} catch (e) {
  results.push('FAIL  跳过这一组 :: ' + (e && e.message ? e.message : e));
}

// ③ 翻月时选中日也要跟着走：以前只改 month，网格是下个月、面板还写着上个月的日子
try {
  closeAnySheet();
  renderCalendar(screen, { store, onOpenSession: () => {} });
  click(screen.querySelector('button[data-next]'));
  await sleep(80);

  const headings = Array.from(screen.querySelectorAll('h3')).map((h) => h.textContent.trim());
  const gridH = headings.find((t) => t.includes('年') && t.includes('月'));
  const panelH = headings.find((t) => /\d+\s*月\s*\d+\s*日/.test(t));
  assert(gridH && panelH, '日历上找不到月份标题');
  const gm = Number((gridH.match(/(\d+)\s*月/) || [])[1]);
  const pm = Number((panelH.match(/(\d+)\s*月/) || [])[1]);
  assert(gm === pm, `翻月后网格是 ${gm} 月、下面面板还是 ${pm} 月`);
  results.push('PASS  日历翻月后下面面板跟着换月');
} catch (e) {
  results.push('FAIL  日历翻月 :: ' + (e && e.message ? e.message : e));
}

// ④ 弹层开合要同步原生的"键盘让位"开关
//    （以前只有 closeSheet 会发 false，true 从来没发出去，原生那套 IME inset 等于没启用）
try {
  const calls = [];
  window.Capacitor = {
    isNativePlatform: () => true,
    Plugins: {
      RestTimer: {
        update: async () => ({ ok: true }),
        stop: async () => ({ ok: true }),
        restDone: async () => ({ ok: true }),
        getState: async () => ({ state: '' }),
        consumeOpenTrain: async () => ({ open: false }),
        setKeyboardMode: async (a) => { calls.push(a); return { ok: true }; },
      },
    },
  };
  closeAnySheet();
  openSheet({ title: '测试弹层', body: '<p>内容</p>' });
  await sleep(80);
  assert(calls.some((c) => c && c.sheetOpen === true), '弹层打开时没有通知原生开启键盘让位');
  closeSheet();
  await sleep(80);
  assert(calls.some((c) => c && c.sheetOpen === false), '弹层关闭时没有通知原生关闭键盘让位');
  delete window.Capacitor;
  results.push('PASS  弹层开合会同步原生的键盘让位开关');
} catch (e) {
  results.push('FAIL  键盘让位开关 :: ' + (e && e.message ? e.message : e));
}

// ⑤ 长按类别→删除确认→点「取消」，编辑器必须还在
//    （确认框是另开的弹层，会顺手把编辑器关掉；以前取消后整个编辑器消失、改动静默丢失）

  closeAnySheet();

  renderPlans(screen, { store, onStart: () => {} });
  click(screen.querySelector('[data-new]'));
  const chips = Array.from(document.querySelectorAll('.sheet [data-cat]'));
  assert(chips.length >= 2, '类别标签太少，测不了长按删除');
  const target = chips[chips.length - 1];

  target.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: 12, clientY: 12 }));
  await sleep(700);
  target.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));

  const cancelBtn = inSheet('[data-cancel]');
  assert(cancelBtn, '长按后应该弹出删除确认');
  click(cancelBtn);
  await sleep(150);

  const editor = document.querySelector('.sheet');
  assert(editor, '点了「取消」之后编辑器整个消失了');
  assert(editor.querySelector('[data-path="name"]'), '取消之后编辑器内容不对（应该是计划编辑器）');
  closeAnySheet();
  results.push('PASS  长按类别后点「取消」，编辑器不会被关掉');
} catch (e) {
  results.push('FAIL  取消删除确认 :: ' + (e && e.message ? e.message : e));
}

/* ---------------------------------------------------------------- 输出 */

await sleep(300);
const out = document.getElementById('out');
const fails = results.filter((r) => r.startsWith('FAIL'));
out.textContent = JSON.stringify({
